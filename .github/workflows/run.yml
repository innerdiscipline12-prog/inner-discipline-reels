name: Inner Discipline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      script:
        description: "Which script to run"
        required: true
        default: "generate"
        type: choice
        options:
          - generate
          - promo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependencies
        run: pip install -r requirements.txt
      - name: Compile generator and originality checks
        run: python -m py_compile generate.py originality.py test_originality.py test_consecutive_reels.py
      # Includes similarity, sentence-coherence, duration, and twenty-reel sequence checks.
      - name: Test originality and twenty consecutive reel assets
        run: python -m unittest -v test_originality.py test_consecutive_reels.py

  build:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the source branch for PR builds; the default PR merge ref is detached
          # and cannot safely push updated generator state back to the source branch.
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg is available
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - run: pip install -r requirements.txt

      - name: Restore persistent generator state
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.script == 'generate' }}
        run: |
          if git fetch origin generator-state; then
            for state_file in series_state.json rotation_state.json used_lines_v3.json engine_state_v3.json hook_state.json; do
              if git cat-file -e "origin/generator-state:$state_file" 2>/dev/null; then
                git show "origin/generator-state:$state_file" > "$state_file"
              fi
            done
            echo "Restored persistent generator state."
          else
            echo "No generator-state branch exists yet; using checked-in defaults."
          fi

      - name: Run generate.py
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.script == 'generate' }}
        run: python generate.py

      - name: Run promo.py
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'promo' }}
        run: python promo.py

      - name: Verify generated video exists
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.script == 'generate' }}
        run: |
          test -d outputs
          test -n "$(find outputs -maxdepth 1 -type f -name '*.mp4' -size +0c -print -quit)" || {
            echo "ERROR: generate.py finished without creating a non-empty MP4 in outputs/."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.script == 'generate' }}
        with:
          name: outputs
          path: outputs/
          if-no-files-found: error
