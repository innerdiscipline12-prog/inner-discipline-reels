name: Inner Discipline

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which script to run"
        required: true
        default: "generate"
        type: choice
        options:
          - generate
          - promo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Run generate.py
        if: ${{ github.event.inputs.script == 'generate' }}
        run: python generate.py

      - name: Run promo.py
        if: ${{ github.event.inputs.script == 'promo' }}
        run: python promo.py

      - name: Verify generated video exists
        if: ${{ github.event.inputs.script == 'generate' }}
        run: |
          test -d outputs
          test -n "$(find outputs -maxdepth 1 -type f -name '*.mp4' -size +0c -print -quit)" || {
            echo "ERROR: generate.py finished without creating a non-empty MP4 in outputs/."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/
          if-no-files-found: error
