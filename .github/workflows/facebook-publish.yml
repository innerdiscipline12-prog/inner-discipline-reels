name: INNER Discipline Facebook + Instagram Publisher V37

on:
  workflow_run:
    workflows: ["Inner Discipline"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - feature/facebook-reels-publisher-v35
      - feature/v36-daily-publishing-schedule
  workflow_dispatch:
    inputs:
      video_path:
        description: "Optional repository-relative MP4 path (normally use automatic generator trigger)"
        required: false
        type: string

concurrency:
  group: inner-discipline-social-publisher
  cancel-in-progress: false

jobs:
  publisher-tests:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/feature/facebook-reels-publisher-v35' ||
       github.ref == 'refs/heads/feature/v36-daily-publishing-schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated publisher tests
        run: |
          python -m py_compile facebook_publisher.py test_facebook_publisher.py instagram_publisher.py test_instagram_publisher.py
          python -m unittest -v test_facebook_publisher.py test_instagram_publisher.py

  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule') &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: \${{ secrets.GITHUB_TOKEN }}

      - name: Download generated Reel artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: outputs
          path: outputs
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          run-id: \${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test both publishers
        run: |
          python -m py_compile facebook_publisher.py test_facebook_publisher.py instagram_publisher.py test_instagram_publisher.py
          python -m unittest -v test_facebook_publisher.py test_instagram_publisher.py

      - name: Validate Facebook publishing credentials
        env:
          FACEBOOK_PAGE_ID: \${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: \${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          test -n "$FACEBOOK_PAGE_ID" || { echo "FACEBOOK_PAGE_ID secret is missing"; exit 1; }
          test -n "$FACEBOOK_PAGE_ACCESS_TOKEN" || { echo "FACEBOOK_PAGE_ACCESS_TOKEN secret is missing"; exit 1; }

      - name: Publish Reel to Facebook
        id: publish_facebook
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ID: \${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: \${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: v27.0
          VIDEO_PATH: \${{ inputs.video_path }}
        run: |
          if [ -n "$VIDEO_PATH" ]; then
            python facebook_publisher.py --video "$VIDEO_PATH"
          else
            python facebook_publisher.py
          fi

      - name: Publish Reel to Instagram
        id: publish_instagram
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: \${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: "17841480472742248"
          META_GRAPH_API_VERSION: v27.0
        run: python instagram_publisher.py

      - name: Commit successful publication registries
        if: always()
        run: |
          git config user.name "inner-discipline-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f published_reels.json ]; then git add published_reels.json; fi
          if [ -f published_instagram_reels.json ]; then git add published_instagram_reels.json; fi
          if git diff --cached --quiet; then
            echo "No new publication records to commit."
          else
            git commit -m "V37: register Facebook and Instagram Reel publications"
            git push origin main
          fi

      - name: Mark run failed if either platform failed
        if: always() && (steps.publish_facebook.outcome != 'success' || (github.event_name == 'workflow_run' && steps.publish_instagram.outcome != 'success'))
        run: |
          echo "At least one platform did not confirm Reel publication."
          echo "Facebook outcome: \${{ steps.publish_facebook.outcome }}"
          echo "Instagram outcome: \${{ steps.publish_instagram.outcome }}"
          exit 1
